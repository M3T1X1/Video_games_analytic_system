{% load static %}
<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>
    <link rel="stylesheet" href="{% static 'frontend/style.css' %}">
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
</head>
<body>

<header>
    <h1>Create your custom analysis</h1>
</header>

<main>
    <section class="container">
        <h2>Interaktywny wykres (Plotly) z pliku CSV</h2>

        <form method="get" class="chart-form">
            <label for="x">Oś X:</label>
            <select name="x" id="x">
                <option value="">-- wybierz kolumnę --</option>
                {% for h in headers %}
                    <option value="{{ h }}" {% if h == selected_x %}selected{% endif %}>{{ h }}</option>
                {% endfor %}
            </select>

            <label for="y">Oś Y:</label>
            <select name="y" id="y">
                <option value="">-- wybierz kolumnę --</option>
                {% for h in headers %}
                    <option value="{{ h }}" {% if h == selected_y %}selected{% endif %}>{{ h }}</option>
                {% endfor %}
            </select>

            <button type="submit">Generuj wykres</button>
             <label for="limit">Limit wyników:</label>
            <input type="number" name="limits" id="limits" value="{{ limits }}" min="1" placeholder="np. 100">
        </form>

        {% if chart_html %}
        <div class="chart">
            {{ chart_html|safe }}
        </div>
        {% endif %}
    </section>
</main>

</body>
</html>
